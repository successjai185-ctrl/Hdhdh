name: BoringSSL transfer

on:
  push:
    branches:
      - chatgpt-boringssl-transfer-20260810

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BoringSSL
        uses: actions/checkout@v4
        with:
          repository: google/boringssl
          ref: main
          path: boringssl
          fetch-depth: 1

      - name: Record revision
        run: git -C boringssl rev-parse HEAD > boringssl/CHATGPT_SOURCE_REVISION.txt

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: boringssl-main-source
          path: boringssl
          include-hidden-files: true
          retention-days: 1
